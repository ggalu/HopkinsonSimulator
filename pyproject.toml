[project]
name = "hopkinson-simulator"
version = "0.1.0"
description = "Hopkinson bar simulator with exact interface ground truth, and Bussac wave separation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy", "matplotlib", "tabulate"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
