# Case ESRF_alu_specimen: the ESRF_alu bar set-up (aluminium bars of 12.7 mm diameter, striker of 250 mm at
# 15 m/s) with a specimen that yields at a force of 2 kN and fails after a compressive shortening of 0.8 mm.
# Love rod (dispersive), lumped elastic-perfectly plastic specimen in unilateral contact with the bars.
# The shot without specimen is the case ESRF_alu.
#
# Run (results in results/<name>/):
#   python hopkinson_simulator.py simulation_cases/ESRF_alu_specimen.toml
# Units: mm, ms, kg; so force in kN, stress in GPa, velocity in mm/ms (= m/s), density in kg/mm^3 and
# frequency in 1/ms (= kHz). Strain is dimensionless, tension positive.
# Every key below is required and no other key is accepted; the program lists all wrong keys at once.
# Distances along a bar are measured from the bar-specimen interface into the bar.
#
# Striker. The setup "shpb" has no striker model; the striker impact is replaced by the incident pulse that it
# produces at the impact end of the input bar, as in ESRF_alu: amplitude -v/(2 c0) = -1.4848e-3 and duration
# 2 Ls/c0 = 0.09898 ms between the 50 % points, with rise and fall times of 4 us (an assumption).
#
# Specimen. Only the yield force (2 kN) and the failure shortening (0.8 mm) are given. The geometry and the
# elastic modulus are assumptions: a cylinder of 6 mm diameter and 6 mm length (area 28.274 mm^2) with the
# modulus of aluminium. The yield stress is therefore 2 kN / 28.274 mm^2 = 0.0707355 GPa, without hardening
# and without rate dependence, so that the specimen force stays at 2 kN during plastic flow. The lumped model
# has no inertia, so only the yield force, the elastic stiffness E As/Ls and the failure shortening enter the
# result; the elastic shortening at 2 kN is 2 kN * 6 mm / (69 GPa * 28.274 mm^2) = 0.006 mm, small against 0.8 mm.

units = "mm-ms-GPa"              # mm, ms, kg; force kN, stress GPa, velocity mm/ms (= m/s), density kg/mm^3
name = "ESRF_alu_specimen"          # results folder name
setup = "shpb"                   # "shpb", "direct_impact" or "shtb"
bar_model = "B"                  # A: 1D wave equation, B: Love rod, C: Pochhammer-Chree (1st mode)

# ---------------------------------------------------------------- bars
[bars]
length_input = 1200.0            # input bar length [mm]
length_output = 1200.0           # output bar length [mm]
far_end_reflections = true       # true: free far ends (strain changes sign on reflection); false: absorbing

[bars.material_input]            # Al 7075, nominal handbook values (assumed; the alloy was not specified)
E = 71.7                         # Young's modulus [GPa]
rho = 2.81e-6                    # density [kg/mm^3]
nu = 0.33                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 6.35                    # bar radius [mm] (12.7 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

[bars.material_output]           # Al 7075, the same as the input bar
E = 71.7                         # Young's modulus [GPa]
rho = 2.81e-6                    # density [kg/mm^3]
nu = 0.33                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 6.35                    # bar radius [mm] (12.7 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

# ---------------------------------------------------------------- strain gauges
[gauges]
input = [600.0]                  # gauge positions on the input bar [mm from the interface]: bar centre
output = [100.0]                 # gauge positions on the output bar [mm from the interface]
gauge_length = 2.0               # active gauge length [mm]
averaging = true                 # true: records are averaged over the gauge length

# ---------------------------------------------------------------- incident pulse
[source]
distance_from_interface = 1200.0 # where the prescribed right-going pulse is defined [mm] (impact end)

[pulse]                          # trapezoid with smooth ramps; equivalent of the 250 mm striker at 15 m/s
amplitude = -1.4848e-3           # plateau strain (negative = compression): -v/(2 c0)
t_start = 0.02                   # pulse start at the source position [ms]
rise = 0.004                     # 0-100 % rise time [ms]
plateau = 0.09498                # plateau duration [ms]; 50 % to 50 % duration 2 Ls/c0 = 0.09898 ms
fall = 0.004                     # 100-0 % fall time [ms]
ramp = "smoothstep7"             # ramp shape: "linear" (C0), "cosine" (C1), "smoothstep7" (C3)

# ---------------------------------------------------------------- specimen
[specimen]                       # assumed geometry (see the header)
kind = "lumped"                  # "lumped": uniform stress (equilibrium), "fd": 1D finite-difference model with wave propagation
length = 6.0                     # specimen length [mm]
diameter = 6.0                   # specimen diameter [mm]
# Required with kind = "fd" and refused with kind = "lumped" (typical values shown):
# n_cells = 40                   # number of cells along the specimen
# cfl = 0.5                      # time step as fraction of the CFL limit
# viscosity = 0.3                # linear artificial viscosity (stability)
# rate_filter_time = 0.5e-3      # strain-rate filter time constant [ms] (stability)
# contact_tolerance = 1.0e-6     # a closed face opens only if the tension exceeds this * E_bar * A_bar

[specimen.material]              # elastic-perfectly plastic, yield force 2 kN
E = 69.0                         # Young's modulus [GPa] (assumed, aluminium)
rho = 2.71e-6                    # density [kg/mm^3] (used by the fd model)
sigma0 = 0.0707355               # initial yield stress [GPa]: 2 kN / 28.274 mm^2
H = 0.0                          # linear hardening (plastic) modulus [GPa]
C = 0.0                          # Johnson-Cook rate sensitivity: sigma_y *= 1 + C ln(edot/edot0)
edot0 = 1.0e-3                   # reference strain rate [1/ms]
rate_dependent = false           # false: rate-independent plasticity
tension_cutoff = true            # true: interfaces cannot carry tension (unilateral contact)
failure_stress = inf             # tensile failure stress [GPa]; inf: no failure
failure_shortening = 0.8         # compressive failure shortening [mm]; then the specimen carries no force

# ---------------------------------------------------------------- time axis and solver
[sampling]
rate = 5000.0                    # sampling rate [1/ms] (= kHz)
duration = 1.0                   # record length [ms]
truth_margin = 0.1               # simulated beyond the record end, then cropped [ms] (avoids end ringing)
n_sub = 10                       # specimen substeps per sample
pad_factor = 8                   # FFT zero padding factor (wrap-around protection)

[coupling]                       # fixed-point iteration between bars and specimen
max_iter = 80                    # maximum number of passes
tol = 1.0e-8                     # relative change of the outgoing waves between passes
