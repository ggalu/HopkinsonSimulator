# Case SHPB: split Hopkinson pressure bar. Love rod (dispersive), prescribed sharp-rise pulse (content up
# to a few 100 kHz), lumped elastic-plastic specimen in unilateral contact with the bars.
#
# Run (results in results/<name>/):
#   python hopkinson_simulator.py simulation_cases/SHPB.toml
# Then the Bussac analysis: python bussac_analysis.py analysis_cases/SHPB.toml
# Units: mm, ms, kg; so force in kN, stress in GPa, velocity in mm/ms (= m/s), density in kg/mm^3 and
# frequency in 1/ms (= kHz). Strain is dimensionless, tension positive.
# Every key below is required and no other key is accepted; the program lists all wrong keys at once.
# Distances along a bar are measured from the bar-specimen interface into the bar.

units = "mm-ms-GPa"              # mm, ms, kg; force kN, stress GPa, velocity mm/ms (= m/s), density kg/mm^3
name = "SHPB"                    # results folder name
setup = "shpb"                   # "shpb", "direct_impact" or "shtb"
bar_model = "B"                  # A: 1D wave equation, B: Love rod, C: Pochhammer-Chree (1st mode)

# ---------------------------------------------------------------- bars
[bars]
length_input = 2000.0            # input bar length [mm]
length_output = 2000.0           # output bar length [mm]
far_end_reflections = true       # true: free far ends (strain changes sign on reflection); false: absorbing

[bars.material_input]            # Al 7075, nominal handbook values
E = 71.7                         # Young's modulus [GPa]
rho = 2.81e-6                    # density [kg/mm^3]
nu = 0.33                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 8.0                     # bar radius [mm] (16 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

[bars.material_output]           # Al 7075, the same as the input bar
E = 71.7                         # Young's modulus [GPa]
rho = 2.81e-6                    # density [kg/mm^3]
nu = 0.33                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 8.0                     # bar radius [mm] (16 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

# ---------------------------------------------------------------- strain gauges
[gauges]
input = [300.0, 850.0]           # gauge positions on the input bar [mm from the interface]
output = [300.0, 850.0]          # gauge positions on the output bar [mm from the interface]
gauge_length = 2.0               # active gauge length [mm]
averaging = true                 # true: records are averaged over the gauge length

# ---------------------------------------------------------------- incident pulse
[source]
distance_from_interface = 2000.0 # where the prescribed right-going pulse is defined [mm] (impact end)

[pulse]                          # trapezoid with smooth ramps
amplitude = -1.0e-3              # plateau strain (negative = compression)
t_start = 0.02                   # pulse start at the source position [ms]
rise = 0.004                     # 0-100 % rise time [ms]
plateau = 0.15                   # plateau duration [ms]
fall = 0.01                      # 100-0 % fall time [ms]
ramp = "smoothstep7"             # ramp shape: "linear" (C0), "cosine" (C1), "smoothstep7" (C3)

# ---------------------------------------------------------------- specimen
[specimen]
kind = "lumped"                  # "lumped": uniform stress (equilibrium), "fd": 1D finite-difference model with wave propagation
length = 5.0                     # specimen length [mm]
diameter = 10.0                  # specimen diameter [mm]
# Required with kind = "fd" and refused with kind = "lumped" (typical values shown):
# n_cells = 40                   # number of cells along the specimen
# cfl = 0.5                      # time step as fraction of the CFL limit
# viscosity = 0.3                # linear artificial viscosity (stability)
# rate_filter_time = 0.5e-3      # strain-rate filter time constant [ms] (stability)
# contact_tolerance = 1.0e-6     # a closed face opens only if the tension exceeds this * E_bar * A_bar

[specimen.material]              # commercially pure Al (1100-O like), engineering values
E = 69.0                         # Young's modulus [GPa]
rho = 2.71e-6                    # density [kg/mm^3] (used by the fd model)
sigma0 = 0.035                   # initial yield stress [GPa]
H = 0.2                          # linear hardening (plastic) modulus [GPa]
C = 0.015                        # Johnson-Cook rate sensitivity: sigma_y *= 1 + C ln(edot/edot0)
edot0 = 1.0e-3                   # reference strain rate [1/ms]
rate_dependent = true            # false: rate-independent plasticity
tension_cutoff = true            # true: interfaces cannot carry tension (unilateral contact)
failure_stress = inf             # tensile failure stress [GPa]; inf: no failure

# ---------------------------------------------------------------- time axis and solver
[sampling]
rate = 5000.0                    # sampling rate [1/ms] (= kHz)
duration = 1.0                   # record length [ms]
truth_margin = 0.1               # simulated beyond the record end, then cropped [ms] (avoids end ringing)
n_sub = 10                       # specimen substeps per sample
pad_factor = 8                   # FFT zero padding factor (wrap-around protection)

[coupling]                       # fixed-point iteration between bars and specimen
max_iter = 80                    # maximum number of passes
tol = 1.0e-8                     # relative change of the outgoing waves between passes
