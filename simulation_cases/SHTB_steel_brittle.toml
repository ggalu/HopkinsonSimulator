# Case SHTB_steel_brittle: split Hopkinson tension bar with steel bars and a linear elastic, brittle specimen.
# The loading end is that of the case SHTB (the same POM striker tube and steel flange); the bars are steel
# instead of Al 7075. The specimen is linear elastic up to its failure stress, at which it breaks and then
# carries no force. Love rod for bars and striker.
#
# Run (results in results/<name>/):
#   python hopkinson_simulator.py simulation_cases/SHTB_steel_brittle.toml
# Then the Bussac analysis: python bussac_analysis.py analysis_cases/SHTB_steel_brittle.toml
# Units: mm, ms, kg; so force in kN, stress in GPa, velocity in mm/ms (= m/s), density in kg/mm^3 and
# frequency in 1/ms (= kHz). Strain is dimensionless, tension positive.
# Every key below is required and no other key is accepted; the program lists all wrong keys at once.
# Global x points from the input bar towards the output bar. Gauge positions are distances from the
# specimen face into each bar; the interface waves of the ground truth are defined at the specimen faces.
#
#   flange | input bar | specimen | output bar | free end
#     ^-- striker (around the input bar, moving in -x) hits the flange from the right

units = "mm-ms-GPa"              # mm, ms, kg; force kN, stress GPa, velocity mm/ms (= m/s), density kg/mm^3
name = "SHTB_steel_brittle"      # results folder name
setup = "shtb"                   # "shpb", "direct_impact" or "shtb"
bar_model = "B"                  # A: 1D wave equation, B: Love rod, C: Pochhammer-Chree (1st mode, solid bars only)

# ---------------------------------------------------------------- bars
[bars]
length_input = 2700.0            # input bar length, flange to specimen [mm]
length_output = 2700.0           # output bar length, specimen to free end [mm]
far_end_reflections = true       # true: free far end of the output bar; false: absorbing

[bars.material_input]            # steel, ASSUMED nominal values (yield far above the bar stress of about 50 MPa)
E = 210.0                        # Young's modulus [GPa]
rho = 7.85e-6                    # density [kg/mm^3]
nu = 0.29                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 8.0                     # bar radius [mm] (16 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

[bars.material_output]           # steel, the same as the input bar
E = 210.0                        # Young's modulus [GPa]
rho = 7.85e-6                    # density [kg/mm^3]
nu = 0.29                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 8.0                     # bar radius [mm] (16 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

# ---------------------------------------------------------------- striker
[striker]                        # tube sliding over the input bar; its far (right) end is free
length = 800.0                   # [mm]; incident pulse duration about 2 length / c_striker = 1.1 ms (POM, as in case SHTB)
velocity = -8.0                  # initial velocity [mm/ms]; negative = towards the flange (-x). Raised from the
                                 # 5 m/s of the case SHTB: with steel bars, 5 m/s gives a peak specimen stress of
                                 # only 860 MPa, so the specimen would not break
impact_time = 0.02               # time of first contact with the flange [ms]
bar_model = "B"                  # dispersion model of the striker: A, B or C (here the same as the bars)

[striker.material]               # POM (Delrin): ASSUMED nominal values, linear elastic (no viscoelasticity)
E = 3.0                          # Young's modulus [GPa]
rho = 1.42e-6                    # density [kg/mm^3]
nu = 0.35                        # Poisson's ratio
radius = 20.0                    # outer radius [mm] (40 mm diameter)
inner_radius = 8.0               # inner radius [mm] (16 mm diameter)
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic

# ---------------------------------------------------------------- flange
[flange]                         # steel transfer flange on the far end of the input bar, treated as a rigid mass
diameter = 40.0                  # [mm]
length = 20.0                    # [mm]
rho = 7.85e-6                    # density [kg/mm^3]; mass = rho * pi d^2/4 * length = 0.197 kg

# ---------------------------------------------------------------- strain gauges
[gauges]
input = [300.0, 850.0]           # gauge positions on the input bar [mm from the specimen face]
output = [300.0, 850.0]          # gauge positions on the output bar [mm from the specimen face]
gauge_length = 2.0               # active gauge length [mm]
averaging = true                 # true: records are averaged over the gauge length

# ---------------------------------------------------------------- specimen
[specimen]
# Bonded to both bars. A linear elastic, brittle specimen: Young's modulus 80 GPa, cross-section 10 mm^2,
# parallel gauge length 15 mm, failure stress 1 GPa, so that it breaks at a force of 10 kN and an elastic
# strain of 1.25 %. Only the parallel gauge section is modelled; the shoulders are taken as rigid.
# With the striker above, the nominal incident strain is about 3.3e-4 (bar force about 13.8 kN). The specimen
# stress reaches 1 GPa about 0.12 ms after the incident wave arrives, at about 0.66 ms, during the rise of the
# transmitted force; the strain rate before failure is about 140 /s (0.14 /ms).
# The fd model is used. All cells have the same failure stress and the stress is nearly uniform at failure,
# so 38 of the 40 cells break within 0.12 us and the face forces fall to zero within 0.4 us, as in the lumped
# model.
kind = "fd"                      # "lumped": uniform stress (equilibrium), "fd": 1D finite-difference model with wave propagation
length = 15.0                    # parallel gauge length [mm]
diameter = 3.5682482             # diameter [mm] of a round section of 10 mm^2 (pi d^2/4 = 1.0e-5 m^2)
# Required with kind = "fd" and refused with kind = "lumped":
n_cells = 40                     # number of cells along the specimen
cfl = 0.5                        # time step as fraction of the CFL limit
viscosity = 0.3                  # linear artificial viscosity (stability)
rate_filter_time = 0.0005        # strain-rate filter time constant [ms] (stability)
contact_tolerance = 1.0e-6       # a closed face opens only if the tension exceeds this * E_bar * A_bar

[specimen.material]              # linear elastic up to brittle failure
E = 80.0                         # Young's modulus [GPa]
rho = 2.5e-6                     # density [kg/mm^3]; ASSUMED (glass-like); sets the wave speed in the fd model
sigma0 = inf                     # initial yield stress [GPa]; inf: no plastic flow (linear elastic)
H = 0.0                          # linear hardening (plastic) modulus [GPa]; not used without yield
C = 0.0                          # Johnson-Cook rate sensitivity; not used (rate_dependent = false)
edot0 = 1.0e-3                   # reference strain rate [1/ms]; not used (rate_dependent = false)
rate_dependent = false           # false: rate-independent
tension_cutoff = false           # must be false: the specimen is bonded to the bars and carries tension
failure_stress = 1.0             # tensile failure stress [GPa]; after failure the specimen carries no force
failure_shortening = inf         # compressive failure shortening [mm]; inf: no failure

# ---------------------------------------------------------------- time axis and solver
[sampling]
rate = 5000.0                    # sampling rate [1/ms] (= kHz)
duration = 2.0                   # record length [ms]
truth_margin = 0.1               # simulated beyond the record end, then cropped [ms] (avoids end ringing)
n_sub = 10                       # substeps per sample for the striker-flange contact and the specimen
pad_factor = 8                   # FFT zero padding factor (wrap-around protection)

[coupling]                       # fixed-point iteration between the loading end, the bars and the specimen
max_iter = 80                    # maximum number of passes
tol = 1.0e-8                     # relative change of the waves between passes
