# Case direct_impact: direct impact of a long Al 7075 projectile bar on a small polymer-like
# specimen that sits on a polycarbonate output bar; Love rod (dispersive) for both bars.
#
# Run (results in results/<name>/):
#   python hopkinson_simulator.py simulation_cases/direct_impact.toml
# Then the Bussac analysis: python bussac_analysis.py analysis_cases/direct_impact.toml
# Units: mm, ms, kg; so force in kN, stress in GPa, velocity in mm/ms (= m/s), density in kg/mm^3 and
# frequency in 1/ms (= kHz). Strain is dimensionless, tension positive.
# Every key below is required and no other key is accepted; the program lists all wrong keys at once.
# Distances along a bar are measured from the bar-specimen interface into the bar.
#
# Direct impact: the input bar is the projectile. It moves at [impact].velocity towards the specimen
# and hits it at [impact].time; there is no prescribed pulse ([source] and [pulse] are refused).
# The input-bar gauges record the wave that the contact force sends back into the projectile, and
# later its echo from the free far end.

units = "mm-ms-GPa"              # mm, ms, kg; force kN, stress GPa, velocity mm/ms (= m/s), density kg/mm^3
name = "direct_impact"           # results folder name
setup = "direct_impact"          # "shpb", "direct_impact" or "shtb"
bar_model = "B"                  # A: 1D wave equation, B: Love rod, C: Pochhammer-Chree (1st mode)

[impact]
velocity = 5.0                   # initial velocity of the input bar (projectile), towards the specimen [mm/ms] (= m/s)
time = 0.02                      # time of first contact [ms] (pre-trigger before it)

# ---------------------------------------------------------------- bars
[bars]
length_input = 2000.0            # input bar (projectile) length [mm]
length_output = 1005.0           # output bar length [mm]
far_end_reflections = true       # true: free far ends (strain changes sign on reflection); false: absorbing

[bars.material_input]            # input bar: Al 7075, nominal handbook values
E = 71.7                         # Young's modulus [GPa]
rho = 2.81e-6                    # density [kg/mm^3]
nu = 0.33                        # Poisson's ratio (enters the dispersion of models B and C)
radius = 8.0                     # bar radius [mm] (16 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

[bars.material_output]           # output bar: polycarbonate, treated as linear elastic (no viscoelasticity)
E = 2.3                          # Young's modulus [GPa]
rho = 1.2e-6                     # density [kg/mm^3]
nu = 0.37                        # Poisson's ratio: ASSUMED (typical value for polycarbonate)
radius = 8.15                    # bar radius [mm] (16.3 mm diameter)
inner_radius = 0.0               # inner radius [mm]; 0: solid bar
tau = 0.0                        # Kelvin-Voigt retardation time [ms]; 0: elastic bar

# ---------------------------------------------------------------- strain gauges
[gauges]
input = [130.0, 530.0]           # gauge positions on the input bar [mm from the impacting end]
output = [120.0, 500.0]          # gauge positions on the output bar [mm from the interface]
gauge_length = 2.0               # active gauge length [mm]
averaging = true                 # true: records are averaged over the gauge length

# ---------------------------------------------------------------- specimen
[specimen]
kind = "lumped"                  # "lumped": uniform stress (equilibrium), "fd": 1D finite-difference model with wave propagation
length = 3.0                     # specimen length [mm]: ASSUMED (not given), aspect ratio 1
diameter = 3.0                   # specimen diameter [mm]
# Required with kind = "fd" and refused with kind = "lumped" (typical values shown):
# n_cells = 40                   # number of cells along the specimen
# cfl = 0.5                      # time step as fraction of the CFL limit
# viscosity = 0.3                # linear artificial viscosity (stability)
# rate_filter_time = 0.5e-3      # strain-rate filter time constant [ms] (stability)
# contact_tolerance = 1.0e-6     # a closed face opens only if the tension exceeds this * E_bar * A_bar

[specimen.material]              # bilinear elastic-plastic, rate independent, engineering values
E = 2.4                          # Young's modulus [GPa]
rho = 1.2e-6                     # density [kg/mm^3]: ASSUMED, used only by the fd model
sigma0 = 0.03                    # yield stress [GPa]
H = 0.34285714285714286          # plastic modulus, slope of stress vs PLASTIC strain [GPa]. It is
                                 # H = E Et / (E - Et) for a tangent modulus Et = 0.3 GPa (slope of stress vs
                                 # total strain after yield).
C = 0.0                          # rate sensitivity: sigma_y *= 1 + C ln(edot/edot0); not used here
edot0 = 1.0e-3                   # reference strain rate [1/ms]; not used here
rate_dependent = false           # true: sigma_y *= 1 + C ln(edot/edot0); false: C and edot0 are not used
tension_cutoff = true            # true: interfaces cannot carry tension (unilateral contact)
failure_stress = inf             # tensile failure stress [GPa]; inf: no failure

# ---------------------------------------------------------------- time axis and solver
[sampling]
rate = 5000.0                    # sampling rate [1/ms] (= kHz)
duration = 2.0                   # record length [ms]; includes the first far-end echoes of both bars
truth_margin = 0.1               # simulated beyond the record end, then cropped [ms] (avoids end ringing)
n_sub = 10                       # specimen substeps per sample
pad_factor = 8                   # FFT zero padding factor (wrap-around protection)

[coupling]                       # fixed-point iteration between bars and specimen
max_iter = 80                    # maximum number of passes
tol = 1.0e-8                     # relative change of the outgoing waves between passes
